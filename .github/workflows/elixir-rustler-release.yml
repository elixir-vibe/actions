name: Elixir Rustler Precompiled Release

on:
  workflow_call:
    inputs:
      project-name:
        description: Rustler crate/project name passed to rustler-precompiled-action.
        required: true
        type: string
      project-dir:
        description: Project directory passed to rustler-precompiled-action.
        required: false
        type: string
        default: .
      project-version-command:
        description: Shell command that prints the project version.
        required: false
        type: string
        default: sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1
      checkout-submodules:
        description: Submodule checkout mode passed to actions/checkout.
        required: false
        type: string
        default: "false"
      apt-packages:
        description: Space-separated Ubuntu packages installed before building.
        required: false
        type: string
        default: ""
      extra-env:
        description: Newline-separated KEY=VALUE pairs exported before build and checksum commands.
        required: false
        type: string
        default: ""
      nif-versions:
        description: JSON array of NIF versions to build.
        required: false
        type: string
        default: '["2.15"]'
      jobs:
        description: JSON array of target jobs with target, os, and optional use-cross.
        required: false
        type: string
        default: >-
          [
            {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04","use-cross":true},
            {"target":"aarch64-apple-darwin","os":"macos-14"},
            {"target":"x86_64-apple-darwin","os":"macos-15"},
            {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04"},
            {"target":"x86_64-unknown-linux-musl","os":"ubuntu-22.04","use-cross":true}
          ]
      cargo-args:
        description: Extra cargo arguments passed to rustler-precompiled-action.
        required: false
        type: string
        default: ""
      cross-version:
        description: cross version passed to rustler-precompiled-action.
        required: false
        type: string
        default: from-source
      rust-cache:
        description: Whether to restore Rust cache before building.
        required: false
        type: boolean
        default: true
      rust-cache-prefix:
        description: Prefix for rust-cache keys.
        required: false
        type: string
        default: rustler-precompiled
      attest-artifacts:
        description: Whether to generate GitHub artifact attestations.
        required: false
        type: boolean
        default: false
      checksum-module:
        description: Elixir RustlerPrecompiled module used to generate a checksum manifest after tagged builds.
        required: false
        type: string
        default: ""
      checksum-file:
        description: Checksum manifest path generated by rustler_precompiled.
        required: false
        type: string
        default: ""
      checksum-elixir:
        description: Elixir version used by the checksum job.
        required: false
        type: string
        default: "1.20"
      checksum-otp:
        description: Erlang/OTP version used by the checksum job.
        required: false
        type: string
        default: "29"
      checksum-deps-command:
        description: Dependency installation command used by the checksum job.
        required: false
        type: string
        default: mix deps.get
      checksum-prepare-command:
        description: Command run before generating the checksum manifest.
        required: false
        type: string
        default: mix compile
      timeout-minutes:
        description: Hard timeout for build and checksum jobs.
        required: false
        type: number
        default: 90

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        nif: ${{ fromJSON(inputs.nif-versions) }}
        job: ${{ fromJSON(inputs.jobs) }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Export extra environment
        if: inputs.extra-env != ''
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Install apt packages
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - name: Extract project version
        shell: bash
        run: |
          version="$(${{ inputs.project-version-command }})"
          if [[ -z "$version" ]]; then
            echo "Project version command returned an empty value" >&2
            exit 1
          fi
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}

      - name: Restore Rust cache
        if: inputs.rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ inputs.rust-cache-prefix }}
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: ${{ inputs.project-name }}
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: ${{ inputs.project-dir }}
          cross-version: ${{ inputs.cross-version }}
          cargo-args: ${{ inputs.cargo-args }}

      - name: Attest artifact
        if: inputs.attest-artifacts && !github.event.repository.private
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build-crate.outputs.file-path }}

      - name: Note unavailable private-repository attestation
        if: inputs.attest-artifacts && github.event.repository.private
        shell: bash
        run: echo "Artifact attestation is unavailable until the repository is public." >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}

  checksum:
    if: inputs.checksum-module != '' && inputs.checksum-file != '' && startsWith(github.ref, 'refs/tags/')
    needs: build_release
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - name: Export extra environment
        if: inputs.extra-env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: printf '%s\n' "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Install apt packages
        if: inputs.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}

      - uses: elixir-vibe/actions/setup-elixir@v1
        with:
          elixir-version: ${{ inputs.checksum-elixir }}
          otp-version: ${{ inputs.checksum-otp }}
          deps-command: "true"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: ${{ inputs.checksum-deps-command }}

      - name: Prepare Rustler metadata
        run: ${{ inputs.checksum-prepare-command }}

      - name: Generate verified checksum manifest
        run: mix rustler_precompiled.download ${{ inputs.checksum-module }} --all --print

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustler-precompiled-checksum
          path: ${{ inputs.checksum-file }}

      - name: Publish checksum manifest
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ inputs.checksum-file }}
